name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite runs against tests/fake_backend.py, so neither torch nor the CLIP
      # weights are needed. Installing them would add ~600 MB and several minutes per
      # job for no extra coverage; the real-backend path is exercised locally with
      # BIKINI_SCANNER_REAL_BACKEND=1.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "Pillow>=10.0" "ruff>=0.6,<1" "mypy>=1.11,<2" "pytest>=8.0,<9" "coverage>=7,<8" "packaging>=23"

      - name: Lint
        run: python -m ruff check bikini_scanner scripts tests

      - name: Typecheck
        run: python -m mypy bikini_scanner

      - name: Format check
        run: python -m ruff format --check bikini_scanner scripts tests

      - name: Tests
        env:
          PYTHONPATH: .
        run: |
          python -m coverage run --source=bikini_scanner -m pytest
          python -m coverage report -m --fail-under=40

      - name: Scoring baseline unchanged
        env:
          PYTHONPATH: .
        run: python scripts/score_baseline.py --compare tests/baseline_scores.json

      - name: Lockfile consistency
        run: python scripts/check_lockfile.py

  audit:
    name: dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Sanitize lockfile for pip-audit
        run: |
          python -c "from pathlib import Path; import re; source=Path('requirements.lock.txt').read_text(encoding='utf-8').splitlines(); lines=[re.sub(r'(\=\=[^+\s#;]+)\+[^\s#;]+', r'\1', line) for line in source if line.strip() and not line.lstrip().startswith(('#', '--index-url', '--extra-index-url'))]; Path('requirements.lock.sanitized.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')"

      - name: Audit locked dependencies
        run: python -m pip_audit --no-deps -r requirements.lock.sanitized.txt

  package-smoke:
    name: package smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build package
        run: python -m PyInstaller bikini_scanner.spec --noconfirm

      - name: Verify package output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist\BikiniScannerApp")) {
            throw "Expected dist\BikiniScannerApp directory was not created."
          }
          if (-not (Test-Path -LiteralPath "dist\BikiniScannerApp\BikiniScanner.exe")) {
            throw "Expected dist\BikiniScannerApp\BikiniScanner.exe was not created."
          }
